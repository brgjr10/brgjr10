<rect width="1000" height="500" fill="#ffffff"/>
<rect width="1000" height="500" fill="url(#lfade)" opacity="0"/><rect x="40" y="40" width="620" height="390" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="680" y="40" width="280" height="390" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="66" y="78" fill="#0969da" font-size="10.5" letter-spacing="2">01 / whoami</text><text x="66" y="112" fill="#1f2328" font-size="21" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" letter-spacing="0.3">WHAT I ACTUALLY BUILD</text><line x1="66" y1="130" x2="640" y2="130" stroke="#d0d7de" opacity="0.6"/><text x="66" y="158" fill="#1f2328" font-size="12.5" opacity="0.86">I build tools that make operations less manual: browser automation for</text><text x="66" y="179" fill="#1f2328" font-size="12.5" opacity="0.86">enterprise systems, Electron desktop apps, React dashboards, and the</text><text x="66" y="200" fill="#1f2328" font-size="12.5" opacity="0.86">self-hosted services that hold all of it together.</text><text x="66" y="237" fill="#1f2328" font-size="12.5" opacity="0.86">Most projects start as a spreadsheet somebody complains about and end as a</text><text x="66" y="258" fill="#1f2328" font-size="12.5" opacity="0.86">scheduled script, a live monitor, or an MCP server an agent can call.</text><text x="66" y="279" fill="#1f2328" font-size="12.5" opacity="0.86">Reliability first — a dashboard nobody trusts is worse than no dashboard.</text><text x="66" y="320" fill="#1f2328" font-size="12.5" opacity="0.86">Home lab is the test rig: ZimaOS, a Raspberry Pi 5, and a PC that</text><text x="66" y="341" fill="#1f2328" font-size="12.5" opacity="0.86">never sleeps. If it does not survive a reboot, it does not ship.</text><text x="702" y="78" fill="#0969da" font-size="10.5" letter-spacing="2">ACCOUNT</text><line x1="702" y1="92" x2="938" y2="92" stroke="#d0d7de" opacity="0.6"/><text x="702" y="106" fill="#8c959f" font-size="9.5" letter-spacing="1.6">ROLE</text><text x="702" y="124" fill="#1f2328" font-size="11">Full-Stack Developer &amp; Operations</text><text x="702" y="139" fill="#1f2328" font-size="11">Automation Engineer</text><text x="702" y="150" fill="#8c959f" font-size="9.5" letter-spacing="1.6">LOCATION</text><text x="702" y="168" fill="#1f2328" font-size="11">Ohio, US</text><text x="702" y="179" fill="#8c959f" font-size="9.5" letter-spacing="1.6">MEMBER SINCE</text><text x="702" y="197" fill="#1f2328" font-size="11">@brgjr10 · SEP 2025</text><text x="702" y="208" fill="#8c959f" font-size="9.5" letter-spacing="1.6">PUBLIC REPOS</text><text x="702" y="226" fill="#1f2328" font-size="11">30</text><text x="702" y="237" fill="#8c959f" font-size="9.5" letter-spacing="1.6">COMMITS</text><text x="702" y="255" fill="#1f2328" font-size="11">447 on the default branch</text><text x="702" y="266" fill="#8c959f" font-size="9.5" letter-spacing="1.6">TOP LANGUAGES</text><text x="702" y="284" fill="#1f2328" font-size="11">HTML · JavaScript · Python</text><text x="702" y="295" fill="#8c959f" font-size="9.5" letter-spacing="1.6">FOLLOWERS</text><text x="702" y="313" fill="#1f2328" font-size="11">1</text><text x="702" y="324" fill="#8c959f" font-size="9.5" letter-spacing="1.6">LAST PUSH</text><text x="702" y="342" fill="#1f2328" font-size="11">8h ago · 2026-10-06</text><rect x="40" y="446" width="920" height="38" rx="10" fill="#eef1f4" stroke="#d0d7de"/><text x="62" y="470" fill="#8c959f" font-size="10" letter-spacing="2">PRIORITIES</text><text x="168" y="470" fill="#0969da" font-size="11" letter-spacing="1.2">RELIABILITY</text><text x="262.6" y="470" fill="#0969da" font-size="12">→</text><text x="279.8" y="470" fill="#0969da" font-size="11" letter-spacing="1.2">READABILITY</text><text x="374.4" y="470" fill="#0969da" font-size="12">→</text><text x="391.6" y="470" fill="#0969da" font-size="11" letter-spacing="1.2">PERFORMANCE</text><text x="486.2" y="470" fill="#0969da" font-size="12">→</text><text x="503.4" y="470" fill="#0969da" font-size="11" letter-spacing="1.2">EXPERIENCE</text>
</svg>