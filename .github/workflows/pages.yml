# Publishes the generated portfolio site to GitHub Pages.
#
# The site is one static file (index.html) stamped by site.mjs
# from data.live.json, so publishing means staging that file and
# handing it to the Pages deploy action. It runs whenever the
# sync workflow commits a fresh index.html, so the site never
# lags the README.
#
# Project Pages URL: https://brgjr10.github.io/brgjr10/
#
# One-time setup (only the first time):
#   Settings -> Pages -> Source -> "GitHub Actions"
#
# To serve this as the user site (https://brgjr10.github.io/)
# instead, push this index.html to the brgjr10.github.io repo —
# the file is self-contained and works from any static host.

name: deploy site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_run:
    workflows: ['sync readme']
    types: [completed]
  workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer sync invalidates an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On workflow_run triggers, only deploy if the sync succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
